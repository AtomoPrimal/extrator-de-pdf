<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Projeto Administrativo-Financeiro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: #ffffff; color: #1f2937; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .box { width: 100%; max-width: 360px; border: 1px solid #e5e7eb; border-radius: 8px; padding: 28px; }
    h1 { font-size: 20px; color: #111827; margin-bottom: 4px; }
    p.sub { font-size: 13px; color: #6b7280; margin-bottom: 20px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #6b7280; margin-bottom: 4px; }
    input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; margin-bottom: 14px; }
    button { width: 100%; padding: 11px; background: #1f2937; color: #fff; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:hover { background: #111827; }
    .erro { color: #b91c1c; font-size: 13px; margin-bottom: 12px; min-height: 1px; }
    .versao { margin-top: 18px; font-size: 11px; color: #9ca3af; text-align: center; }
  </style>
</head>
<body>
  <form class="box" method="post" action="/login">
    <h1>Projeto Administrativo-Financeiro</h1>
    <p class="sub">Entre com seu usuário e senha</p>
    <div class="erro">{{ERRO}}</div>
    <label for="usuario">Usuário</label>
    <input id="usuario" name="usuario" autocomplete="username" required autofocus>
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
    <div class="versao">Versão (commit GitHub): {{COMMIT}}</div>
  </form>
</body>
</html>
